name: CMake Raylib Windows Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2 MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        release: false
        pacboy: gcc:p cmake:p ninja:p
        install: zip

    - name: Configure CMake
      shell: msys2 {0}
      run: |
        cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      shell: msys2 {0}
      run: cmake --build build

    - name: Create ZIP Artifact
      shell: msys2 {0}
      run: |
        mkdir -p release
        cp build/Sudoku-Coop.exe release/
        cp -r build/assets release/assets
        zip -r Sudoku-Coop-windows.zip release/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: Sudoku-Coop-windows.zip
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: ""
        draft: false
        prerelease: false